services:
  mongo:
    image: mongo:7
    container_name: restrox-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: runner
    container_name: restrox-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/restrox}
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
